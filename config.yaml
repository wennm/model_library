# =================
# 全局配置
# =================

model:
  0:
    model_name: "elevator_motor"
    model_path: "weight/elevator_motor.pt"    # 摩托车入电梯
    class_path: "model_library.model.base_model.BaseModel"
    classes: [0]
    imgsz: 1  # 1 代表模型采用原图大小
    # GPU配置
    estimated_memory: 800  # 预估显存需求(MB)
    preferred_gpu: null    # 优先GPU ID，null表示自动分配

  1:
    model_name: "fire_lane_blockage"
    class_path: "model_library.model.track_fireland.TrackFireland"
    classes: [0]
    model_path: "weight/fire_lane_blockage.pt"  # 消防通道占用
    time_threshold: 60  # 消防通道占用时间阈值
    imgsz: 1  # 1 代表模型采用原图大小
    # GPU配置
    estimated_memory: 1200  # 预估显存需求(MB)
    preferred_gpu: null    # 优先GPU ID，null表示自动分配

  2:
    model_name: "fire_detect"
    class_path: "model_library.model.base_model.BaseModel"
    model_path: "weight/fire_yolo11x.pt"    # 火点检测
    config: 0.4
    classes: [0,1]
    imgsz: 1  # 1 代表模型采用原图大小


  3:
    model_name: "accident"
    class_path: "model_library.model.track_accident.TrackAccident"
    # model_path: "weight/accident_with_person_new1111night.pt"    # 事故检测_20251112
    model_path: "weight/best_accident_baseyolox.pt"    # 事故检测_20251112
    # model_path: "weight/accident_with_person.pt"    # 事故检测_20251111
    # model_path: "weight/yolo_accident_obb_v2.pt"    # 事故检测_20251023
    # model_path: "weight/yolo_accident_obb_havegame_nomoni.pt"    # 事故检测_20251024
    classes: [0, 1]
    config: 0.4  # 通用置信度阈值（作为后备）
    time_step: 60  # 消息推送的间隔
    imgsz: 1  # 1 代表模型采用原图大小
    # 分类别置信度阈值配置
    class_confidence:
      accident: 0.5    # 事故检测阈值 (class=0)
      pedestrian: 0.5  # 行人检测阈值 (class=1)
    # 事故验证策略配置
    verification_strategy: "overlap"  # 可选: overlap, distance, combined, none
    verification_config:
      # 面积重叠策略配置 (overlap策略使用)
      overlap_threshold: 0.3  # 重叠面积阈值，默认0.5

      # 距离策略配置 (distance策略使用)
      distance_threshold: 200  # 距离阈值（像素），默认200
      use_center_distance: true  # 是否使用中心点距离，false使用边界框最小距离

      # 联合策略配置 (combined策略使用)
      require_both: false  # 是否需要同时满足重叠和距离条件，false表示满足任一即可

    # VLM 多模态辅助验证配置
    vlm_verification:
      enabled: true  # 开启多模态辅助验证
      stream: true  # 启用流式输出（更快响应，支持早期退出）
      # prompt: "图中红色框选区域内是否发生了车辆碰撞或交通事故？请回答是或否。"
      prompt: "图中红色框选区域内是否发生了车辆碰撞或交通事故？疑似剐蹭也算，如两辆车贴得很近，周围有两个以上的人在查看车辆，一定要有人。请只回答是或否。"
      # prompt: "这是无人机视角下的图片，图中红色框选区域内是否有两个或以上的人。请只回答是或否。"  #后备prompt
      # model: "Qwen/Qwen2.5-VL-72B-Instruct" # 可选：覆盖全局配置的模型
      timeout: 4  # API 超时时间（秒）
      stream_timeout: 7  # 流式接收超时时间（秒），超时后降级使用算法验证结果
      total_timeout: 15.0  # 硬性总超时时间（秒），超过此时间直接降级使用算法验证结果
      # modelscope:
      #   api_key: "sk-d2d735f9d40b42b5bb2c777df2fc864b"
      #   base_url: "http://10.1.38.201:8000/v1/"
      #   model: "whilezzc/traffic_accident_qwen2_5vl_32b_detail"



  4:
    model_name: "license plate"
    class_path: "model_library.model.plate_model.PlateModel"
    model_path: "weight/best_epoch32_CCPDfintune_baseYOLOv11.pt"    # 车牌检测
    ocr_model_path: "weight/plate_rec_color.pth"    # 车牌ocr
    ocr_provider: "modelscope"  # 可选: local, modelscope
    config: 0.3
    classes: [0,1]
    imgsz: 0  # 0 代表模型不采用原图大小
    # SAHI配置（可选）
    enable_sahi: true  # 是否启用SAHI切片推理
    sahi_config:
      initial_confidence: 0.15  # SAHI初始检测置信度
      device: null  # 自动选择设备，可指定"cuda:0"或"cpu"
      slice_params:  # 可选的自定义切片参数，如为空则自动确定
        # slice_height: 512
        # slice_width: 512
        # overlap_height_ratio: 0.25
        # overlap_width_ratio: 0.25

  5:
    model_name: "car"
    class_path: "model_library.model.car_model.CarModel"
    model_path: "weight/yolo_visdrone.pt"    # 车辆检测
    config: 0.5
    classes: [3,4,5,8]
    imgsz: 0  # 0 代表模型不采用原图大小
  
  6:
    model_name: "infrared"
    class_path: "model_library.model.infrared_model.InfraredModel"
    # model_path: "weight/yolo_infrared.pt"    # 红外行人检测
    # model_path: "weight/yolo_infrared_v2.pt"    # 红外行人检测_20251023
    model_path: "weight/infrared_v4_baseyolo12x.pt"    # 红外行人检测_20251215
    # model_path: "weight/yolo_infrared_v4_baseyolo11x_onlyperson.pt"    # 红外行人检测_20251209
    config: 0.7
    classes: [0]
    imgsz: 0  # 修改为0以支持SAHI切片推理
    enable_tracking: true  # 是否启用跟踪（批量图片处理建议关闭）
    # GPU配置
    estimated_memory: 2500  # 预估显存需求(MB)，SAHI算法需要更多显存
    preferred_gpu: null    # 优先GPU ID，null表示自动分配
    # SAHI配置（可选）
    enable_sahi: true  # 是否启用SAHI切片推理
    sahi_config:
      initial_confidence: 0.7  # SAHI初始检测置信度，红外检测可以适当调高
      device: null  # 自动选择设备，可指定"cuda:0"或"cpu"
      slice_params:  # 可选的自定义切片参数，如为空则自动确定
        slice_height: 928
        slice_width: 928
        overlap_height_ratio: 0.25
        overlap_width_ratio: 0.25

  7:
    model_name: "face_detect"
    class_path: "model_library.model.base_model.BaseModel"
    model_path: "weight/yolov11x-face-detection.pt"    # 人脸检测_20251125
    # model_path: "weight/yolov11n-face.pt"    # 人脸检测
    config: 0.5
    classes: [0]
    imgsz: 1  # 1 代表模型采用原图大小

  8:
    model_name: "infrared_motorcycle"
    class_path: "model_library.model.infrared_motorcycle.InfraredMotorcycleModel"
    model_path: "weight/model8_infrared_motorcycle_yolo12x_v1.1.pt"    # 夜间红外摩托车检测
    config: 0.55  # 检测置信度阈值
    classes: [0]  # 0: motorcycle
    imgsz: 0  # 不采用原图大小，支持SAHI切片推理
    # GPU配置
    estimated_memory: 2500  # 预估显存需求(MB)，SAHI算法需要更多显存
    preferred_gpu: null    # 优先GPU ID，null表示自动分配
    # SAHI配置
    enable_sahi: true  # 是否启用SAHI切片推理
    sahi_config:
      initial_confidence: 0.55  # SAHI初始检测置信度
      device: null  # 自动选择设备
      slice_params:  # 可选的自定义切片参数
        slice_height: 1080
        slice_width: 1080
        overlap_height_ratio: 0.2
        overlap_width_ratio: 0.2
    # 聚集检测配置
    gathering_strategy: "distance"  # 可选: distance, none
    gathering_config:
      distance_threshold: 300  # ⭐ 距离阈值（像素），判断聚集的距离
      min_gathering_count: 3    # ⭐ 最少聚集数量（固定为3）
      use_center_distance: true  # 使用中心点距离
      speed_window_size: 2        # 速度计算使用的帧数窗口（仅用于计算速度，不影响上报）
    # ========== 新追踪模式配置 ==========
    tracking_mode_duration: 5.0  # ⭐⭐⭐ 追踪模式持续时间（秒），默认5秒
    report_interval: 1.0         # ⭐⭐⭐ 追踪上报间隔（秒），默认1秒


